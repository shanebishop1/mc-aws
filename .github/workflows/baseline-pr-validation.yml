name: Baseline Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: 22.15.1
  PNPM_VERSION: 10.30.3

jobs:
  quality:
    name: Non-mutating checks, types, tests, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run non-mutating Biome checks
        run: pnpm exec biome check .

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit and contract tests
        run: pnpm test

      - name: Validate documentation
        run: pnpm docs:check

      - name: Verify validation did not modify the checkout
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  mock-e2e:
    name: Mock Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run mock Playwright E2E tests
        run: pnpm test:e2e:mock

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mock-playwright-e2e-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 3

  builds:
    name: Clean Next.js and OpenNext builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_SECRET: ci-only-auth-secret-not-used-outside-builds
      ADMIN_EMAIL: ci@example.invalid
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      NEXT_PUBLIC_APP_URL: https://ci.example.invalid
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run clean Next.js production build
        run: |
          set -euo pipefail
          rm -rf .next
          pnpm build

      - name: Run clean OpenNext Cloudflare build
        run: |
          set -euo pipefail
          rm -rf .next .open-next
          ci_wrangler_config=".wrangler.ci.jsonc"
          trap 'rm -f "$ci_wrangler_config"' EXIT
          pnpm exec tsx scripts/panel-hosting.ts prepare-config \
            --source wrangler.jsonc \
            --output "$ci_wrangler_config" \
            --kv-id 00000000000000000000000000000000 \
            --kv-preview-id 11111111111111111111111111111111 \
            --mode workers_dev \
            --custom-workers-dev true
          pnpm exec opennextjs-cloudflare build --config "$ci_wrangler_config"

      - name: Verify builds did not modify the checkout
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  infrastructure:
    name: CDK synth and shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Offline synthesis validates literal pinning without selecting a deployable image.
      AL2023_ARM64_AMI_ID: ami-11111111111111111
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare offline CDK context
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const account = "111111111111";
          const region = "us-east-1";
          const lookupKey = `vpc-provider:account=${account}:filter.isDefault=true:region=${region}:returnAsymmetricSubnets=true`;
          const context = {
            [lookupKey]: {
              vpcId: "vpc-12345",
              vpcCidrBlock: "10.0.0.0/16",
              ownerAccountId: account,
              availabilityZones: [],
              subnetGroups: [{
                name: "Public",
                type: "Public",
                subnets: [{
                  subnetId: "subnet-12345",
                  cidr: "10.0.0.0/24",
                  availabilityZone: `${region}a`,
                  routeTableId: "rtb-12345",
                }],
              }],
            },
          };
          fs.writeFileSync("./infra/cdk.context.json", `${JSON.stringify(context, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CDK_DEFAULT_ACCOUNT=${account}\nCDK_DEFAULT_REGION=${region}\n`);
          NODE

      - name: Synthesize CDK application
        # --quiet prevents the synthesized template's infrastructure metadata
        # from being copied into the public Actions log.
        env:
          MC_ALLOW_EMPTY_WHITELIST: "true"
        run: pnpm cdk:synth --quiet --no-lookups

      - name: Validate tracked shell syntax
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 -r bash -n

      - name: Verify infrastructure checks did not modify the checkout
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  production-audits:
    name: Root and Lambda production dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit root production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit SeedEmailAllowlist production dependencies
        working-directory: infra/src/lambda/SeedEmailAllowlist
        run: npm audit --omit=dev --audit-level=high

      - name: Audit StartMinecraftServer production dependencies
        working-directory: infra/src/lambda/StartMinecraftServer
        run: npm audit --omit=dev --audit-level=high

      - name: Verify audits did not modify the checkout
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  secret-scan:
    name: Secret scan (introduced commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan Git history for secrets
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"

          if [ -n "$PR_BASE_SHA" ]; then
            scan_range="$PR_BASE_SHA..$GITHUB_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero_sha" ]; then
            scan_range="$BEFORE_SHA..$GITHUB_SHA"
          else
            scan_range="$GITHUB_SHA^..$GITHUB_SHA"
          fi

          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="$scan_range"

      - name: Verify secret scan did not modify the checkout
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
